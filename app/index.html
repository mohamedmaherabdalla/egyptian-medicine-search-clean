<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medicine lookup</title>
  <link rel="stylesheet" href="styles.css?v=20260812.1">
</head>
<body>
  <main>
    <header class="topline">
      <div class="brand">Medicine lookup</div>
      <div id="status" class="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Starting Algorithm 6...</span>
      </div>
    </header>

    <form class="search-shell" id="searchForm">
      <div class="search-panel">
        <label class="sr-only" for="query">Medicine name</label>
        <input
          id="query"
          type="search"
          autocomplete="off"
          autocapitalize="none"
          enterkeyhint="search"
          spellcheck="false"
          dir="auto"
          placeholder="Medicine name or gaps: ...TRIL, RIVO..., ...VOT..., PANA...OL"
        >
        <button id="clearBtn" class="clear-button" type="button" aria-label="Clear search" hidden>&times;</button>
        <button id="searchBtn" type="submit">
          <span class="button-label">Search</span>
          <span class="button-progress" aria-hidden="true"></span>
        </button>
      </div>
      <p class="gap-help">
        Put <code>...</code> wherever text is unreadable: before, after, on both ends, or between visible parts.
      </p>
      <div class="context-panel">
        <label for="productContext">Product details <span>optional</span></label>
        <div class="context-input-shell">
          <input
            id="productContext"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            dir="auto"
            placeholder="600, 500 mg, tablets, 24 pack"
          >
          <button id="contextClearBtn" class="context-clear" type="button" aria-label="Clear product details" hidden>&times;</button>
        </div>
      </div>
    </form>

    <div id="error" class="error" role="alert"></div>
    <div id="summary" class="summary" role="status" aria-live="polite"></div>

    <section id="results" class="results" aria-live="polite" aria-busy="false"></section>
  </main>

  <script src="app.js?v=20260812.1"></script>
</body>
</html>
